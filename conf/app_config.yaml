logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: ${oc.env:DB_HOST,localhost}
  port: ${oc.env:DB_PORT,3306}
  user: ${oc.env:DB_USER,shopkeeper}
  password: ${oc.env:DB_PASSWORD,change_me_local_only}
  database: meta

db_dw:
  host: ${oc.env:DB_HOST,localhost}
  port: ${oc.env:DB_PORT,3306}
  user: ${oc.env:DB_USER,shopkeeper}
  password: ${oc.env:DB_PASSWORD,change_me_local_only}
  database: dw

qdrant:
  host: ${oc.env:QDRANT_HOST,localhost}
  port: ${oc.env:QDRANT_PORT,6333}
  embedding_size: 1024

embedding:
  host: ${oc.env:EMBEDDING_HOST,localhost}
  port: ${oc.env:EMBEDDING_PORT,8081}
  model: BAAI/bge-large-zh-v1.5

es:
  host: ${oc.env:ES_HOST,localhost}
  port: ${oc.env:ES_PORT,9200}
  index_name: ${oc.env:ES_INDEX_NAME,value_index}

llm:
  model_name: zai-org/GLM-5.3
  api_key: ${oc.env:LLM_API_KEY}
  base_url: https://api.siliconflow.cn/v1
